name: Import Fartleks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: staza-${{ inputs.environment }}-fartlek-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Fartleks to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    environment:
      name: app-${{ inputs.environment }}

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/staza_deploy
          chmod 600 ~/.ssh/staza_deploy

          ssh-keyscan \
            -T 10 \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Run Fartlek snapshot import
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          REMOTE_PATH: ${{ vars.REMOTE_PATH }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/staza_deploy \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- \
            "$REMOTE_PATH" \
            "$TARGET_ENV" <<'REMOTE'

          set -Eeuo pipefail

          remote_path="$1"
          target_env="$2"

          cd "$remote_path"

          compose() {
            docker compose \
              --env-file .env \
              -f docker-compose.yml \
              "$@"
          }

          echo "========================================"
          echo "Fartlek snapshot import"
          echo "========================================"
          echo "Environment: $target_env"
          echo "Remote path: $remote_path"
          echo "Snapshot: /import-source/osm-germany-fartleks.ndjson"
          echo

          if [[ ! -f .env ]]; then
            echo "Missing .env in $remote_path" >&2
            exit 1
          fi

          if [[ ! -f docker-compose.yml ]]; then
            echo "Missing docker-compose.yml in $remote_path" >&2
            exit 1
          fi

          image_name="$(sed -n 's/^STAZA_IMAGE=//p' .env | head -n 1)"
          image_tag="$(sed -n 's/^STAZA_IMAGE_TAG=//p' .env | head -n 1)"

          if [[ -z "$image_name" || -z "$image_tag" ]]; then
            echo "Could not determine deployed image." >&2
            exit 1
          fi

          echo "Current image: ${image_name}:${image_tag}"
          echo

          echo "Validating Compose configuration."
          compose config --quiet

          echo
          echo "Ensuring PostgreSQL is running."
          compose up -d postgres

          postgres_container="$(compose ps -q postgres)"

          if [[ -z "$postgres_container" ]]; then
            echo "PostgreSQL container could not be found." >&2
            exit 1
          fi

          postgres_health="unknown"

          for attempt in $(seq 1 30); do
            postgres_health="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' \
                "$postgres_container" \
                2>/dev/null || printf 'missing'
            )"

            echo "PostgreSQL health attempt $attempt/30: $postgres_health"

            if [[ "$postgres_health" == "healthy" ]]; then
              break
            fi

            if [[ "$postgres_health" == "unhealthy" || "$postgres_health" == "missing" ]]; then
              break
            fi

            sleep 5
          done

          if [[ "$postgres_health" != "healthy" ]]; then
            echo "PostgreSQL did not become healthy." >&2
            compose logs --no-color --tail=100 postgres >&2 || true
            exit 1
          fi

          echo
          echo "Starting one-off import container."
          echo

          snapshot_file="/import-source/osm-germany-fartleks.ndjson"
          compose run \
            --rm \
            --no-deps \
            app \
            sh -c '
              set -eu

              snapshot_file="/import-source/osm-germany-fartleks.ndjson"
              if [ ! -s "$snapshot_file" ]; then
                echo "Uploaded snapshot not found or empty: $snapshot_file" >&2
                echo "Upload it to /opt/staza/data/osm-germany-fartleks.ndjson on the VPS." >&2
                exit 1
              fi
              echo "Using uploaded Fartlek snapshot:"
              ls -lh "$snapshot_file"

              echo "Importing Fartleks."
              npm run import:fartleks -- --snapshot "$snapshot_file"

              echo "Import completed successfully"
            '

          echo
          echo "Environment: $target_env"
          echo "Image: ${image_name}:${image_tag}"
          echo "Snapshot: $snapshot_file"
          echo "Result: SUCCESS"

          REMOTE
